agent_profile_id: null
enabled: true
entrypoint: .venv/bin/python main.py
keep_alive: true
model: Bedrock-Claude-Sonnet-4-5-fast
name: SDLC_1 - Jira to PR
preset_metadata:
  preset_type: prompt
  prompt: "# Jira request to draft pull request\n\n**Manual test with no event:**\
    \ Check only the repository, instructions, GitHub access, and Jira integration,\
    \ then stop. Do not select a Jira issue, even if one is open. Do not post comments\
    \ or change Jira or GitHub. If probing Jira directly, use its configured authentication\
    \ method (`JIRA_AUTH_MODE`). Mark the readiness check successful when those checks\
    \ pass, and say that the event workflow was not exercised.\n\nFor a Jira event,\
    \ follow the cloned repository\u2019s `AGENTS.md` and `sdlc-story` skill. Use\
    \ the Jira request and its acceptance criteria to make a focused change, validate\
    \ it, and open a draft pull request for human review. For documentation, check\
    \ deployment-specific claims against current settings and general rules against\
    \ provider documentation; identify anything unverified. After opening the pull\
    \ request, add the `openhands-review` label before finishing so the review can\
    \ start. Do not add `openhands-qa` here; review owns that handoff. Leave scope\
    \ decisions, approval, merge, and deployment to people. Do not expose credentials\
    \ or change branch protection or deployment settings.\n\nAdd a conversation link\
    \ to the pull request only when the current run provides a verifiable URL or conversation\
    \ ID. Never guess a link. End every Jira comment and pull request description\
    \ posted by this run with: `Created by an AI agent (OpenHands) on behalf of Rajiv\
    \ Shah.`\n\nFinish with a structured status and a short outcome summary. For event\
    \ runs, mark success only after the draft pull request and required handoff are\
    \ complete; otherwise explain what remains blocked or failed."
  repos:
  - ref: main
    url: https://github.com/rajistics-demo/sdlc-automation-github-demo
prompt: "# Jira request to draft pull request\n\n**Manual test with no event:** Check\
  \ only the repository, instructions, GitHub access, and Jira integration, then stop.\
  \ Do not select a Jira issue, even if one is open. Do not post comments or change\
  \ Jira or GitHub. If probing Jira directly, use its configured authentication method\
  \ (`JIRA_AUTH_MODE`). Mark the readiness check successful when those checks pass,\
  \ and say that the event workflow was not exercised.\n\nFor a Jira event, follow\
  \ the cloned repository\u2019s `AGENTS.md` and `sdlc-story` skill. Use the Jira\
  \ request and its acceptance criteria to make a focused change, validate it, and\
  \ open a draft pull request for human review. For documentation, check deployment-specific\
  \ claims against current settings and general rules against provider documentation;\
  \ identify anything unverified. After opening the pull request, add the `openhands-review`\
  \ label before finishing so the review can start. Do not add `openhands-qa` here;\
  \ review owns that handoff. Leave scope decisions, approval, merge, and deployment\
  \ to people. Do not expose credentials or change branch protection or deployment\
  \ settings.\n\nAdd a conversation link to the pull request only when the current\
  \ run provides a verifiable URL or conversation ID. Never guess a link. End every\
  \ Jira comment and pull request description posted by this run with: `Created by\
  \ an AI agent (OpenHands) on behalf of Rajiv Shah.`\n\nFinish with a structured\
  \ status and a short outcome summary. For event runs, mark success only after the\
  \ draft pull request and required handoff are complete; otherwise explain what remains\
  \ blocked or failed."
setup_script_path: setup.sh
tarball_executables:
- setup.sh
tarball_source:
  type: internal
  url: null
timeout: 1800
trigger:
  destination: dispatch_run
  filter: issue.fields.project.key == 'KAN' && issue.fields.issuetype.name == 'Task'
    && !contains(issue.fields.labels, 'sidekick-v2') && !contains(issue.fields.labels,
    'dependency-remediation') && !contains(issue.fields.labels, 'security-remediation')
  'on': jira:issue_created
  source: jira-direct
  subject_key_expr: null
  turn_text_expr: null
  type: event
  wake_agent: true
