setup_script_path: setup.sh
tarball_executables:
- setup.sh
tarball_source:
  type: internal
  url: null
timeout: 1800
trigger:
  destination: dispatch_run
  filter: null
  'on': jira:issue_created
  source: jira-direct
  subject_key_expr: null
  turn_text_expr: null
  type: event
  wake_agent: true
