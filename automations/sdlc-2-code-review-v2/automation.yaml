setup_script_path: setup.sh
tarball_executables:
- setup.sh
tarball_source:
  type: internal
  url: null
timeout: 600
trigger:
  destination: dispatch_run
  filter: repository.full_name == 'rajistics-demo/sdlc-automation-github-demo' &&
    pull_request != null && label.name == 'openhands-review' && !contains(pull_request.labels[].name,
    'openhands:done')
  'on':
  - pull_request.labeled
  source: github
  subject_key_expr: null
  turn_text_expr: null
  type: event
  wake_agent: true
