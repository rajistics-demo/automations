setup_script_path: setup.sh
tarball_executables:
- setup.sh
tarball_source:
  type: internal
  url: null
timeout: 1800
trigger:
  filter: icontains(resource.comment.content, 'openhands-qa') && !icontains(resource.comment.content,
    'Automated QA via OpenHands Automation')
  'on': ms.vss-code.git-pullrequest-comment-event
  source: azure-devops
  type: event
