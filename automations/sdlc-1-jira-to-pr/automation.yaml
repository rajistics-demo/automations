agent_profile_id: null
enabled: false
entrypoint: .venv/bin/python main.py
keep_alive: true
model: Bedrock-Claude-Sonnet-4-5-fast
name: SDLC_1 - Jira to PR
preset_metadata: null
prompt: '# Jira Request To Pull Request


  Start by loading and following the cloned repository''s `sdlc-story` skill. That
  repository-owned skill, together with `AGENTS.md`, is the source of truth for how
  to investigate, implement, validate, and hand off the attached Jira request.


  Produce a focused, human-reviewable draft pull request. People remain responsible
  for scope, review, merge, deployment, and risky follow-up. Do not merge, change
  deployment settings or branch protection, or expose credentials.


  Include the concrete OpenHands conversation link from `$AUTOMATION_SESSION_URL`
  in the pull-request description when it is available. Every Jira comment and pull-request
  description posted by this run must end with: `Created by an AI agent (OpenHands)
  on behalf of Rajiv Shah.`

  '
setup_script_path: setup.sh
tarball_executables:
- ._setup.sh
- setup.sh
tarball_source:
  type: internal
  url: null
timeout: 1800
trigger:
  filter: null
  'on': jira:issue_created
  source: jira-direct
  type: event
