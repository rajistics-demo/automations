agent_profile_id: null
enabled: true
entrypoint: .venv/bin/python main.py
keep_alive: true
model: Bedrock-Claude-Sonnet-4-6
name: Multi-Agent Demo - Implement Approved Spec
preset_metadata: null
prompt: "# Implement an Approved Specification\n\nA human added the `openhands-implement-spec`\
  \ label to a GitHub issue. Treat the\nissue as approval to prepare an implementation\
  \ for review, not approval to\nmerge it.\n\n## Workflow\n\n1. Verify that the event\
  \ repository matches the cloned repository. Read the\n   triggering issue and its\
  \ comments.\n2. Locate the specification and dependency-linked tickets referenced\
  \ by the\n   issue. If they are missing, ambiguous, or not committed, comment with\
  \ the\n   missing information and stop with `needs-human` before changing code.\n\
  3. Load and follow the repository-local\n   `.agents/skills/implement-spec/SKILL.md`\
  \ skill.\n4. Before delegating, verify that the native `task` tool is available.\
  \ If it is\n   unavailable, do not silently perform the multiagent workflow as one\
  \ agent;\n   comment that native subagents are unavailable and stop with `needs-human`.\n\
  5. Use implementer subagents and isolated git worktrees for the ready ticket\n \
  \  frontier. Merge completed ticket branches into one integration branch in\n  \
  \ dependency order.\n6. Run the repository's tests and a read-only code review.\
  \ Resolve blocking\n   findings before marking the pull request ready.\n7. Post\
  \ a concise issue comment containing the parent conversation, branch,\n   pull request,\
  \ completed tickets, validation evidence, and the human's next\n   decision.\n\n\
  ## Safety And Idempotency\n\n- Search for an existing branch or pull request associated\
  \ with the issue\n  before starting. Resume valid existing work instead of creating\
  \ a duplicate.\n- Never change acceptance tests merely to make the implementation\
  \ pass.\n- Never merge, approve, deploy, change branch protection, or modify secrets.\n\
  - Leave the completed pull request ready for human review.\n- If delegation, validation,\
  \ push, or recovery evidence is incomplete, stop\n  with `needs-human`; never infer\
  \ success from partial side effects.\n\n## Final Contract\n\nEnd with exact plain-text\
  \ `field: value` lines:\n\nstatus: done | needs-human | failed\nbranch: <branch\
  \ or none>\npr: <url or none>\ntests: <concise evidence or not-run>\nsummary: <five\
  \ or fewer semicolon-separated items>\nnext_gate: human-review | stop\n"
setup_script_path: setup.sh
tarball_executables:
- setup.sh
tarball_source:
  type: internal
  url: null
timeout: 1800
trigger:
  filter: repository.full_name == 'rajshah4/openhands-multi-agent-demo' && issue.pull_request
    == null && label.name == 'openhands-implement-spec'
  'on':
  - issues.labeled
  source: github
  type: event
