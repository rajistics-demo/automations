setup_script_path: setup.sh
tarball_executables:
- setup.sh
tarball_source:
  type: internal
  url: null
timeout: 1800
trigger:
  filter: contains(detailedMessage.text, 'openhands-build') && !contains(detailedMessage.text,
    'Automated Spec-to-PR via OpenHands Automation')
  'on': workitem.commented
  source: azure-devops
  type: event
